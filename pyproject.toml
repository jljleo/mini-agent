# 分发元数据（pipx install .）：扁平模块项目，hatchling 按显式清单装入 wheel
# （含 models.default.json——config.py 按 __file__ 定位它，必须与模块同目录）。
# 依赖列表与 requirements.txt 保持同步（dev 流程仍走 requirements.txt）。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "led-review"
version = "0.1.0"
description = "led——可度量检出率的 code review agent（BYOK：用户自配 AI API key）"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
    "tree-sitter>=0.26",
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.25",
    "tree-sitter-rust>=0.24",
    "tree-sitter-java>=0.23",
]

[project.scripts]
led = "led_review.main:main"

[tool.hatch.build.targets.wheel]
packages = ["led_review"]  # 正经包：models.default.json 作为 package data 自动随包

[tool.ruff]
target-version = "py313"
line-length = 120
# bench/tasks/** 是评测工作区（给模型修的有缺陷代码 + 判分脚本），不是本仓库生产代码
#（且 workspace 刻意带真实项目里常见的 lint 瑕疵）；脚本生成物也不入 lint 范围
exclude = ["bench/tasks/**"]

[tool.ruff.lint]
# E pycodestyle / F pyflakes / I isort / UP pyupgrade / B bugbear
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # 行长：大量中文注释/字符串，交给 ruff-format 而非 lint
]

[tool.ruff.lint.isort]
known-first-party = ["led_review", "bench"]
