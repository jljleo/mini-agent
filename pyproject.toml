# 工具配置（依赖仍由 requirements.txt 管理，本文件不放项目元数据）

[tool.ruff]
target-version = "py313"
line-length = 120
# bench/tasks/** 是评测工作区（给模型修的有缺陷代码 + 判分脚本），不是本仓库生产代码
#（且 workspace 刻意带真实项目里常见的 lint 瑕疵）；脚本生成物也不入 lint 范围
exclude = ["bench/tasks/**"]

[tool.ruff.lint]
# E pycodestyle / F pyflakes / I isort / UP pyupgrade / B bugbear
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # 行长：大量中文注释/字符串，交给 ruff-format 而非 lint
]

[tool.ruff.lint.isort]
known-first-party = ["agent", "bench", "command_registry", "commands", "compact", "config", "events", "input_utils", "judge", "streaming", "tool_registry", "tools", "trace", "tui", "tui_render", "ui"]
