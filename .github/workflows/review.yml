# PR 自动 code review：led dogfood 闭环——uses 仓库自身的 action（自举）
#
# 每个 PR 用 PR 自己的代码 review 自己的 diff：
#   - uses: ./ 是本地 action 路径（本仓库根 action.yml），install_from: . 装的是
#     PR 分支源码——改坏 review 能力的 PR 会立刻体现在自己的 review 质量里。
#   - 用户场景唯一差异是 install_from 缺省（PyPI 包 led-review），其余逻辑相同。
#   - action 封装被每个 PR 实测，封装坏了的 PR 会自己卡住自己/报错在评论里。
#
# 需要在仓库 Settings → Secrets 配置 KIMI_CODE_API_KEY（BYOK）。
# 设计决策：
#   - fail_on_high 缺省 false：review 是信息性评论，不阻塞合并（precision 未被
#     充分证明前不做门禁；E8-E10 的误报数据够格后再开门禁）
#   - fork PR 跳过（secrets 不可用，也防外部 PR 烧 key）
#   - concurrency cancel：force-push 时取消过期的 review

name: review

on:
  pull_request:

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write  # gh pr comment 需要（默认 token 在某些仓库设置下只读）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # review 需要 base...HEAD 的完整祖先

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: ./
        with:
          api_key: ${{ secrets.KIMI_CODE_API_KEY }}
          install_from: "."